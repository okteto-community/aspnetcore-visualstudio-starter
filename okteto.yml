deploy:
  remote: true
  commands:
    - kubectl apply -f k8s.yml


build: 
  hello-world: 
    context: hello-world
    dockerfile: Dockerfile
  hello-world-dev:
    context: hello-world
    target: dev

dev:
  hello-world:
    image: ${OKTETO_BUILD_HELLO_WORLD_DEV_IMAGE}
    # command: nohup /vsdbg/vsdbg --interpreter=vscode > /dev/null 2>&1 & bash
    command: bash
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    remote: 2222
    sync:
      - hello-world:/src
