build: 
  hello-world: 
    context: hello-world
    dockerfile: Dockerfile
  hello-world-dev:
    context: hello-world
    target: dev

deploy:
  remote: true
  commands:
    - envsubst < k8s.yml | kubectl apply -f - 

dev:
  hello-world:
    image: ${OKTETO_BUILD_HELLO_WORLD_DEV_IMAGE}
    command: bash
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - VSDEBUGGER_SKIP_INSTALL=1
    remote: 2222
    sync:
      - hello-world:/src
